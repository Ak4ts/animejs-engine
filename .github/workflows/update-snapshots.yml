# Regenerates Playwright visual baselines on Linux (the CI platform) and commits them
# to the selected branch. Never generate baselines on a local Windows machine.
name: Update visual snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:update
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e
          git diff --cached --quiet && echo "No snapshot changes" && exit 0
          git commit -m "test(e2e): update visual snapshots"
          git push
